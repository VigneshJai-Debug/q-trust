<svg xmlns="http://www.w3.org/2000/svg" width="230" height="230" viewBox="0 0 230 230">
  <defs>
    <linearGradient id="qt-orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="qt-core" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#16233f"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <filter id="qt-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer orbit -->
  <g filter="url(#qt-glow)">
    <circle cx="115" cy="115" r="96" fill="none" stroke="url(#qt-orb)" stroke-width="1.6"
            stroke-dasharray="3 9" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0 115 115" to="360 115 115"
                        dur="24s" repeatCount="indefinite"/>
    </circle>
    <!-- orbiting node -->
    <circle cx="115" cy="19" r="4.5" fill="#00d9ff">
      <animateTransform attributeName="transform" type="rotate" from="0 115 115" to="360 115 115"
                        dur="24s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#00d9ff;#a855f7;#00d9ff" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- inner counter-rotating orbit -->
  <circle cx="115" cy="115" r="74" fill="none" stroke="#7c8bff" stroke-width="1.1"
          stroke-dasharray="14 10" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="360 115 115" to="0 115 115"
                      dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- pulsing halo -->
  <circle cx="115" cy="115" r="58" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="56;64;56" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.12;0.55" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- hexagonal core -->
  <polygon points="115,58 164,86 164,144 115,172 66,144 66,86" fill="url(#qt-core)"
           stroke="url(#qt-orb)" stroke-width="2.4" filter="url(#qt-glow)"/>
  <text x="115" y="134" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace"
        font-size="56" font-weight="bold" fill="#e6edf3">Q</text>
</svg>
