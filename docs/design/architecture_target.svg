  <rect x="718" y="470" width="210" height="92" rx="8" fill="#f0fdfa" stroke="#5eead4"/><text x="823" y="490" text-anchor="middle" font-weight="600" fill="#134e4a">Compliance Engine</text><text x="823" y="506" text-anchor="middle" fill="#475569">NIST IR 8547 · CNSA 2.0</text><text x="823" y="522" text-anchor="middle" fill="#475569">policy · deadlines · status</text><text x="823" y="538" text-anchor="middle" fill="#0a675f" font-weight="600">FIPS 140-3 aware</text>
  <rect x="942" y="470" width="212" height="92" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-dasharray="4 3"/><text x="1048" y="490" text-anchor="middle" font-weight="600" fill="#92400e">ZK Compliance (P2)</text><text x="1048" y="506" text-anchor="middle" fill="#475569">prove PQC-ready without</text><text x="1048" y="522" text-anchor="middle" fill="#475569">revealing the inventory</text><text x="1048" y="538" text-anchor="middle" fill="#b45309" font-weight="600">privacy-preserving audit</text>
</g>

