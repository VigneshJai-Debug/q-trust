  <rect x="718" y="260" width="210" height="92" rx="8" fill="#f0fdfa" stroke="#5eead4"/><text x="823" y="280" text-anchor="middle" font-weight="600" fill="#134e4a">RL Migration Agent</text><text x="823" y="296" text-anchor="middle" fill="#475569">PPO · 100% completion</text><text x="823" y="312" text-anchor="middle" fill="#475569">beats random, near-optimal</text><text x="823" y="328" text-anchor="middle" fill="#0a675f" font-weight="600">sequencing + waves</text>
