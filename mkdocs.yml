site_name: Q-Trust Documentation
site_description: >-
  Q-Trust — on-chain coordination for the post-quantum migration
  of enterprise cryptography. CBOM scanning, GPU-accelerated
  analysis, GNN/RL migration planning, verifiable provenance on
  Base L2.
site_url: https://humoge7502.github.io/q-trust/
repo_url: https://github.com/humoge7502/q-trust
repo_name: humoge7502/q-trust
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024 Q-Trust Contributors. MIT Licensed.
strict: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/humoge7502/q-trust
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/qtrust-sdk/
    - icon: material/shield-lock
      link: https://github.com/humoge7502/q-trust/security/policy
    - icon: material/book-open-page-variant
      link: https://humoge7502.github.io/q-trust/
  version:
    provider: mike

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: info
    absolute_links: info
    anchors: info
    unrecognized_links: info

nav:
  - Home: index.md
  - Guides:
      - Scan your first CBOM: guides/scan-first-cbom.md
      - Deploy to Base Sepolia: guides/deploy-base-sepolia.md
      - Integrate the SDK: guides/integrate-sdk.md
      - Operate the stack: guides/operate-stack.md
  - Architecture: ARCHITECTURE.md
  - Reference:
      - Whitepaper: WHITEPAPER.md
      - Performance: PERFORMANCE.md
      - GPU Features: GPU_FEATURES.md
      - CBOM Conformance: CBOM_CONFORMANCE.md
  - Deployment:
      - Base Sepolia: deployment/BASE_SEPOLIA.md
      - Multi-Chain: deployment/MULTI_CHAIN.md
      - Go-Live Checklist: deployment/GO_LIVE_CHECKLIST.md
  - Case Studies:
      - example.com TLS Assessment: case-studies/CASE_STUDY_EXAMPLE_COM.md
  - ADRs:
      - ADR 0000 — Record architecture decisions: adr/0000-record-architecture-decisions.md
      - ADR 0001 — Base L2 selection: adr/0001-base-l2-selection.md
      - ADR 0002 — EIP-712 gasless relay (all writes): adr/0002-eip712-gasless-relay-all-writes.md
      - ADR 0003 — UUPS + timelock governance: adr/0003-uups-timelock-governance.md
      - ADR 0004 — Postgres read model with RPC fallback: adr/0004-postgres-read-model-with-rpc-fallback.md
      - ADR 0005 — In-house Python VC/DID (Veramo for JS later): adr/0005-in-house-python-vc-did-veramo-for-js-later.md
      - ADR 0006 — Deterministic content-addressed IDs: adr/0006-deterministic-content-addressed-ids.md
  - Runbooks:
      - Backup & Restore: runbook/backup-restore.md
      - Incident Response: runbook/incident-response.md
