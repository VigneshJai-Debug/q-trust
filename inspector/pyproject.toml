[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptography-inspector"
version = "1.0.0"
description = "Enterprise-grade PQC migration scanner. Discovers cryptographic assets across TLS, SSH, source code, binaries, package manifests, containers, and cloud. Produces CycloneDX 1.7 CBOM, SARIF 2.1, risk scores (NIST/CNSA 2.0/HNDL), compliance reports (NIST SP 800-131A, CNSA 2.0, FIPS 140-3, EU NIS2, FISMA, FedRAMP, CMMC), migration roadmaps, and hash-chained evidence ledgers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Q-Trust Protocol", email = "dev@qtrust.dev" },
]
keywords = ["cryptography", "scanner", "cbom", "tls", "ssh", "post-quantum", "pqc", "cyclonedx", "sarif", "nist", "cnsa", "compliance", "risk", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "cryptography>=43.0.0",
    "python-nmap>=0.7.1",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
crypto-inspector = "qtrust_inspector.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["qtrust_inspector*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
