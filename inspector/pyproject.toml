[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptography-inspector"
version = "0.1.0"
description = "Cryptography scanner that discovers TLS/SSH/key assets and produces a Cryptographic Bill of Materials (CBOM)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Q-Trust Protocol", email = "dev@qtrust.dev" },
]
keywords = ["cryptography", "scanner", "cbom", "tls", "ssh", "post-quantum", "pqc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=41.0.0",
    "python-nmap>=0.7.1",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
crypto-inspector = "qtrust_inspector.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["qtrust_inspector*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]