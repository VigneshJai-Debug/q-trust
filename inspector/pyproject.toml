[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrust-inspector"
version = "2.2.0"
description = "Multi-language cryptographic inventory & post-quantum risk scanner producing CycloneDX CBOMs, SARIF findings, compliance scoring (NIST/CNSA/PCI/BSI/NCSC/ASD), PCAP & network-log HNDL analysis, and migration roadmaps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Q-Trust Protocol", email = "dev@qtrust.dev" },
]
keywords = ["cryptography", "scanner", "cbom", "tls", "ssh", "post-quantum", "pqc", "cyclonedx", "sarif", "nist", "cnsa", "compliance", "risk", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "cryptography>=46.0.6",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
net = ["python-nmap>=0.7.1"]
ml = ["torch>=2.0.0", "numpy>=1.24.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
crypto-inspector = "qtrust_inspector.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["qtrust_inspector*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Aligned with the repo-wide contract in ../.ruff.toml (E4/E7/E9/F) so
# `ruff check .` from the repo root enforces one consistent rule set. This
# package's stricter E/F/I/W/UP contract was never actually satisfied by the
# codebase (331+ violations), so keeping it here only made repo lint red.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
