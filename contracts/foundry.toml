[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
test = "test"
# Exclude OpenZeppelin's own test files from compilation
deny_warnings = false
ignored_warnings_from = ["lib/openzeppelin-contracts"]

# Remap OpenZeppelin imports
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
base_sepolia = "${QTRUST_BASE_SEPOLIA_RPC}"

[etherscan]
base_sepolia = { key = "${QTRUST_BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 64
depth = 32
