# Q-Trust backend docker-compose.
# Starts the API, the webhook watcher, the Postgres indexer store,
# Redis, and the AI planner microservice.
#
# Usage:
#   cp .env.example .env
#   # edit .env with your RPC URL, private key, and contract addresses
#   docker compose up -d

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: qtrust-backend:0.1.0
    container_name: qtrust-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - QTRUST_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - QTRUST_PG_URL=postgres://${POSTGRES_USER:-qtrust}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-qtrust}
      - QTRUST_PLANNER_URL=http://planner:8000
      - QTRUST_BASE_SEPOLIA_RPC=${QTRUST_BASE_SEPOLIA_RPC:-http://host.docker.internal:8545}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - qtrust-net

  webhook:
    image: qtrust-backend:0.1.0
    container_name: qtrust-webhook
    restart: unless-stopped
    command: ["bun", "run", "dist/services/webhook.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - QTRUST_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - QTRUST_BASE_SEPOLIA_RPC=${QTRUST_BASE_SEPOLIA_RPC:-http://host.docker.internal:8545}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - qtrust-net

  postgres:
    image: postgres:16-alpine
    container_name: qtrust-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-qtrust}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-qtrust}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qtrust} -d ${POSTGRES_DB:-qtrust}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qtrust-net

  planner:
    build:
      context: ./planner
      dockerfile: Dockerfile
    image: qtrust-planner:0.1.0
    container_name: qtrust-planner
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QTRUST_MODEL_PATH=/app/model.pt
      - QTRUST_DEADLINES_PATH=/app/data/algorithms.json
    networks:
      - qtrust-net

  redis:
    image: redis:7-alpine
    container_name: qtrust-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qtrust-net

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  qtrust-net:
    driver: bridge