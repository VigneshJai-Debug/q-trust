[pytest]
# Only the project's own Python suites. Backend/frontend use npm/vitest, not pytest.
testpaths =
    planner/tests
    inspector/tests
    sdk/tests
    qtrust_ai/tests
# Never collect third-party/vendored trees (e.g. the real-dataset repo caches
# under qtrust_ai/artifacts/real_datasets/cache/** ship their own test files
# that need C headers and must not run in our CI).
norecursedirs =
    .*
    build
    dist
    node_modules
    qtrust_ai/artifacts
    exports
    site
    profile-repo
addopts = -q
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
