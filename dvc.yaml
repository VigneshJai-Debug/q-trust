stages:
  traces_v1:
    cmd: python -m qtrust_inspector.qscan_code  # placeholder: real harness is inspector/scripts/trace_harness.c
    deps:
      - inspector/qtrust_inspector/side_channel.py
    outs:
      - inspector/data/traces_v1:
          persist: true
  estates_v1:
    cmd: python -m qtrust_planner.data_generator
    deps:
      - planner/qtrust_planner/data_generator.py
    outs:
      - planner/data/estates_v1:
          persist: true
  planner_benchmark:
    cmd: PYTHONPATH=planner python -m qtrust_planner.benchmark_v3 --n-graphs 200 --json-out planner/results/benchmark_v3.json
    deps:
      - planner/qtrust_planner/benchmark_v3.py
      - planner/qtrust_planner/eval_harness.py
    outs:
      - planner/results/benchmark_v3.json
      - planner/results/eval_harness.json

