name: PQC Quantum Readiness Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  pqc-scan:
    name: Post-Quantum Cryptography Scan
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        language: [python, javascript, go, java, rust, csharp]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Q-Trust Inspector
        run: pip install -e ./inspector

      - name: Run PQC Source Scan
        run: |
          crypto-inspector scan-source . \
            --language ${{ matrix.language }} \
            --format sarif \
            --output scan-${{ matrix.language }}.sarif \
            --cyclonedx cbom-${{ matrix.language }}.json \
            --risk \
            --compliance all \
            || true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          sarif_file: scan-${{ matrix.language }}.sarif
          category: pqc-${{ matrix.language }}

      - name: Upload CBOM Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cbom-${{ matrix.language }}
          path: cbom-${{ matrix.language }}.json
          retention-days: 30

      - name: Check Compliance Gate
        run: |
          crypto-inspector scan-source . \
            --language ${{ matrix.language }} \
            --format json \
            --output results.json \
            --risk \
            --compliance cnsa-2.0 \
            --ci-gate high \
            || echo "::warning::PQC compliance gate found findings"

  network-scan:
    name: TLS/SSH Endpoint Scan
    runs-on: ubuntu-22.04
    # Only run when real targets are configured (repo variable, comma-separated).
    if: github.event_name == 'push' && vars.PQC_SCAN_TARGETS != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Q-Trust Inspector
        run: pip install -e ./inspector

      - name: Scan TLS Endpoints
        env:
          PQC_SCAN_TARGETS: ${{ vars.PQC_SCAN_TARGETS }}
        run: |
          mkdir -p tls-sarif
          for target in ${PQC_SCAN_TARGETS//,/ }; do
            echo "Scanning $target..."
            crypto-inspector host "$target" \
              --ports 443 \
              --sarif "tls-sarif/$target.sarif" \
              --cyclonedx "tls-cbom-$target.json" \
              --risk || echo "::warning::scan failed for $target"
          done
          ls -la tls-sarif/

      - name: Upload TLS SARIF
        if: always() && hashFiles('tls-sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          sarif_file: tls-sarif
          category: pqc-tls

  report:
    name: Generate PQC Report
    runs-on: ubuntu-22.04
    needs: [pqc-scan, network-scan]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Q-Trust Inspector
        run: pip install -e ./inspector

      - name: Download all CBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cbom-*
          merge-multiple: true

      - name: Generate Executive Report
        run: |
          python -c "
          import json, glob
          findings = []
          for f in glob.glob('cbom-*.json'):
              try:
                  data = json.load(f)
                  findings.extend(data.get('components', []))
              except: pass
          
          total = len(findings)
          pqc_ready = sum(1 for c in findings if c.get('quantumSafe', False))
          score = max(0, 100 - (total * 2) + (pqc_ready * 5)) if total > 0 else 100
          
          report = {
              'quantum_readiness_score': score,
              'total_assets': total,
              'pqc_ready': pqc_ready,
              'vulnerable': total - pqc_ready,
          }
          print(json.dumps(report, indent=2))
          with open('pqc-report.json', 'w') as f:
              json.dump(report, f, indent=2)
          "

      - name: Upload Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pqc-report
          path: pqc-report.json
