name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
jobs:
  contracts:
    name: Solidity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - run: forge build --sizes
        working-directory: contracts
      - run: forge test -vvv
        working-directory: contracts
      - name: Forge Coverage (lcov)
        working-directory: contracts
        run: forge coverage --report lcov --ir-minimum
      - name: Upload Contracts coverage
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303 # v4.5.0
        with:
          files: contracts/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  contract-verify:
    name: Basescan Contract Verification
    runs-on: ubuntu-latest
    # Verification only makes sense against freshly merged main deployments.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - run: forge build
        working-directory: contracts
      - name: Verify deployed contracts on Basescan
        working-directory: contracts
        env:
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          DEPLOYED_PROXY_ADDRESSES: ${{ vars.DEPLOYED_PROXY_ADDRESSES }}
        run: |
          if [ -z "$BASESCAN_API_KEY" ]; then echo "BASESCAN_API_KEY not set — skipping verification"; exit 0; fi
          if [ -z "$DEPLOYED_PROXY_ADDRESSES" ]; then echo "DEPLOYED_PROXY_ADDRESSES not configured — skipping"; exit 0; fi
          # DEPLOYED_PROXY_ADDRESSES: multiline "Name=0x..." pairs (see contracts/verification/README.md).
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(echo "$line" | tr -d '[:space:]')"
            case "$line" in ''|\#*) continue ;; esac
            name="${line%%=*}"
            addr="${line#*=}"
            echo "Verifying $name at $addr"
            args=()
            if [ -f "verification/${name}.args" ]; then
              args=(--constructor-args-path "verification/${name}.args")
            fi
            forge verify-contract \
              --chain-id 8453 \
              --verifier etherscan \
              --verifier-url https://api.basescan.org/api \
              "${args[@]}" \
              "$addr" "src/${name}.sol:${name}" \
              || echo "::warning::verification failed for ${name}"
          done <<EOF
          $DEPLOYED_PROXY_ADDRESSES
          EOF

  sdk:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -e ./sdk[dev]
      - run: pytest sdk/tests/ -v --cov=qtrust --cov-report=xml:coverage-sdk.xml --cov-report=term
      - name: Upload SDK coverage
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303 # v4.5.0
        with:
          files: coverage-sdk.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: pip install ruff && ruff check sdk/

  property-tests:
    name: Property-Based Tests (Hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -e ./sdk[dev]
      - name: Run Hypothesis property tests (1000 examples) with statistics
        run: pytest sdk/tests/test_properties.py -v --hypothesis-show-statistics
        env:
          HYPOTHESIS_PROFILE: ci

  inspector:
    name: Inspector Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -e "./inspector[dev,ml]"
      - run: pytest inspector/tests/ -v --cov=qtrust_inspector --cov-report=xml:coverage-inspector.xml --cov-report=term
      - name: Upload Inspector coverage
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303 # v4.5.0
        with:
          files: coverage-inspector.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.11.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm run test
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: backend

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: 00000000000000000000000000000000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.11.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  planner:
    name: Planner Tests (GNN + RL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install planner dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r planner/requirements.txt
          pip install pytest httpx scipy numpy
      - name: Run planner tests
        run: pytest planner/tests/ -v
        env:
          QTRUST_PLANNER_DEVICE: cpu
      # P2-10: training smoke stage — fits a hundred graphs end-to-end on CPU so objective regressions are caught by machines (pdf §20)
      - name: Training smoke — 100 graphs to completion (detects loss regressions)
        run: |
          python -c "
          import torch
          from pathlib import Path
          from qtrust_planner.train_gpu import train_gpu
          out = train_gpu(n_graphs=100, epochs=3, batch_size=16, model_path='/tmp/smoke_v3.pt', device_name='cpu')
          assert Path(out).exists(), 'smoke model not written'
          # Verify loss decreased by checking checkpoint can be loaded and tau is not NaN
          from qtrust_planner.benchmark_v3 import _load_v3
          m,_ = _load_v3(Path('/tmp/smoke_v3.pt'))
          assert m is not None, 'smoke checkpoint unloadable'
          print('smoke training succeeded:', out)
          "
      - name: Eval harness — 3-seed OOD suite ( doctrine )
        run: |
          python -m qtrust_planner.eval_harness --model-path planner/model.pt --n-graphs 200 --seeds 42 43 44 --json-out /tmp/eval_harness.json
          cat /tmp/eval_harness.json | head -n 50
          python -c "
          import json
          data=json.load(open('/tmp/eval_harness.json'))
          assert 'suites' in data and 'in_dist' in data['suites'], 'eval harness missing in_dist'
          # Check median tau is recorded
          assert 'kendall' in data['suites']['in_dist'], 'missing kendall'
          print('eval harness passed, suites:', list(data['suites'].keys()))
          "
      - name: Benchmark gate — provenance is recorded (P0-4 fix)
        run: |
          python -m qtrust_planner.benchmark_v3 --n-graphs 200 --json-out /tmp/bench_v3.json
          cat /tmp/bench_v3.json | head -n 80
          python -c "
          import json
          data=json.load(open('/tmp/bench_v3.json'))
          # Every entry must carry provenance: device, seeds, data_hash
          for name, v in data.items():
              assert 'device' in v, f'{name} missing device provenance'
              assert 'data_hash' in v, f'{name} missing data_hash'
              assert 'seeds' in v, f'{name} missing seeds'
          print('benchmark provenance gate passed')
          "
      # Pending promotion gate (manual): uncomment when LayerNorm v3 beats v2 tau 0.961
      # - name: Promotion gate — v3 must beat v2 before QTRUST_MODEL_PATH defaults to v3
      #   run: |
      #     python -m qtrust_planner.benchmark_v3 --n-graphs 1000 --json-out /tmp/v3_vs_v2.json
      #     python -c "
      #     import json
      #     d=json.load(open('/tmp/v3_vs_v2.json'))
      #     v2=list(d.values())[0]['kendall']; v3=list(d.values())[1]['kendall']
      #     assert v3 > v2, f'v3 tau {v3:.4f} must beat v2 tau {v2:.4f} before promotion'
      #     "

  playwright:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.11.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: frontend
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: 00000000000000000000000000000000
        run: npx playwright test --project=desktop-chromium
        env:
          NEXT_PUBLIC_QTRUST_API_URL: http://localhost:3001

  abi-drift:
    name: ABI Bindings Match Forge Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Build contracts (artifacts for ABI generation)
        run: forge build --root contracts

      - name: Regenerate TS + Python ABI bindings and diff against committed
        # Audit remediation: the .gitignore comment claims CI fails on drift,
        # but no such job existed. This enforces it — UUPS upgrades without
        # regenerating abis.ts/contracts.py produce cryptic decoding errors.
        run: |
          set -e
          python3 scripts/generate_abis.py
          if ! git diff --exit-code -- backend/src/lib/abis.ts sdk/qtrust/contracts.py; then
            echo "::error::ABI bindings are stale — run 'python3 scripts/generate_abis.py' and commit the result."
            exit 1
          fi
          echo "ABI bindings are up to date."

  golive-preflight:
    name: Go-live Preflight (No Placeholders)
    # Deliberately gated to release tags so day-to-day CI stays green while
    # operational placeholders remain, but no release can ship with them.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject placeholder escalation contacts / security contacts
        # Audit §18.1/§22.8: _PLACEHOLDER_ runbook contacts and the
        # security@q-trust.example mailbox are acknowledged go-live blockers.
        # This gate fails until a human replaces them with real values.
        run: ./scripts/check_golive_blockers.sh
