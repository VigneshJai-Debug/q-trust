name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  slither:
    name: Slither Solidity Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: contracts/
          fail-on: config
        continue-on-error: false

      - name: Upload Slither SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
          category: slither

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep scan
        run: >
          semgrep scan --config auto --error
          --exclude-rule generic.secrets.security.detected-generic-secret
        continue-on-error: false

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [inspector, sdk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install component
        run: pip install -e ./${{ matrix.component }}

      - name: Audit installed dependencies
        # No requirements.txt is maintained for inspector/sdk; audit the resolved
        # environment instead. --skip-editable excludes the component itself.
        run: pip-audit --skip-editable --strict
        continue-on-error: false

  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dev-key-guard:
    name: Reject Known Dev Keys Outside Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan for well-known Anvil/Hardhat dev keys in non-test files
        # The Anvil account #0 key is public and safe in test fixtures only.
        # pilot/run_pilot.py now requires QTRUST_DEPLOYER_PRIVATE_KEY from the
        # environment, so any literal reappearance outside tests/ fails the build.
        run: |
          set -e
          KEY='0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
          VIOLATIONS=$(git grep -l "$KEY" -- \
            ':(exclude)*.test.*' \
            ':(exclude)**/tests/**' \
            ':(exclude)**/test/**' \
            ':(exclude)scripts/**' \
            ':(exclude).github/**' \
            ':(exclude)docs/**' \
            ':(exclude)CHANGELOG.md' \
            ':(exclude)SECURITY.md' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Known Anvil dev key found outside test contexts:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No dev keys outside test files."
