name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  slither:
    name: Slither Solidity Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@f197989dea5b53e986d0f88c60a034ddd77ec9a8 # v0.4.0
        id: slither
        with:
          target: contracts/
          # lib/openzeppelin-contracts is third-party audited code (its
          # timelock arbitrary-send is by design). Remaining src/ detector
          # hits are Low/Informational classes (timestamp, pragma,
          # incorrect-equality on explicit zero-checks) — gate on HIGH only.
          slither-args: --filter-paths "lib/openzeppelin-contracts"
          fail-on: high
        continue-on-error: false

      - name: Upload Slither SARIF
        if: always() && steps.slither.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
          category: slither

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep scan
        # - inspector/benchmarks holds intentionally vulnerable fixtures.
        # - pickles-in-pytorch is excluded because every torch.load call site
        #   passes weights_only=True (each carries a nosemgrep annotation as
        #   documentation); CodeQL and gitleaks provide overlapping coverage.
        run: >
          semgrep scan --config auto --error
          --exclude-rule generic.secrets.security.detected-generic-secret
          --exclude-rule trailofbits.python.pickles-in-pytorch.pickles-in-pytorch
          --exclude inspector/benchmarks
        continue-on-error: false

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          category: codeql-${{ matrix.language }}

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [inspector, sdk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install component
        # Non-editable install so every distribution is resolvable. The matrix
        # value goes through env (never direct ${{ }} interpolation in run:)
        # per semgrep run-shell-injection.
        env:
          COMPONENT: ${{ matrix.component }}
        run: pip install "./$COMPONENT"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit installed dependencies
        # Audit third-party packages only: the component itself is not on
        # PyPI, so auditing it directly makes --strict fail on resolution.
        run: |
          pip freeze | grep -v "^qtrust" > /tmp/audit-reqs.txt
          pip-audit --strict -r /tmp/audit-reqs.txt
        continue-on-error: false

  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dev-key-guard:
    name: Reject Known Dev Keys Outside Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan for well-known Anvil/Hardhat dev keys in non-test files
        # The Anvil account #0 key is public and safe in test fixtures only.
        # pilot/run_pilot.py now requires QTRUST_DEPLOYER_PRIVATE_KEY from the
        # environment, so any literal reappearance outside tests/ fails the build.
        run: |
          set -e
          KEY='0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
          VIOLATIONS=$(git grep -l "$KEY" -- \
            ':(exclude)*.test.*' \
            ':(exclude)**/tests/**' \
            ':(exclude)**/test/**' \
            ':(exclude)scripts/**' \
            ':(exclude).github/**' \
            ':(exclude)docs/**' \
            ':(exclude)CHANGELOG.md' \
            ':(exclude)SECURITY.md' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Known Anvil dev key found outside test contexts:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No dev keys outside test files."

  model-integrity:
    name: Verify .pt Checkpoint Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify models.sha256
        # Audit remediation: the tracked model checkpoints are binary blobs —
        # without an integrity manifest a supply-chain swap is undetectable.
        run: ./scripts/verify_models.sh
