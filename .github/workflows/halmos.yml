name: Formal Verification (Halmos)

# Symbolically executes the core registry integrity properties with Halmos.
#
# Scope note: the full stateful RegistryHandler setUp deploys the registries
# behind ERC1967Proxies, and Halmos cannot flatten the OZ initializer guard's
# internal branch ("Multiple paths were found in setUp()"), nor explore the
# 9-entrypoint handler within a CI time budget. The stateful fuzz invariants
# therefore run under forge (test/invariant/RegistryInvariant.t.sol).
#
# RegistrySymbolic.t.sol instead deploys the raw implementations (roles and
# per-product limits granted via direct storage writes, since the
# implementations disable initializers by design — audit C-2) and verifies:
#   A. every signed registration advances the signer's nonce by exactly one
#      (asset / vendor / migration registries),
#   B. a signed registration is immediately resolvable and active.
# This exercises the real registry logic (hasRole/onlyRole, EIP-712
# recovery, nonce accounting, storage) symbolically in ~1s.

on:
  push:
    branches: [main]
    paths:
      - "contracts/src/**"
      - "contracts/test/**"
      - ".github/workflows/halmos.yml"
  pull_request:
    paths:
      - "contracts/src/**"
      - "contracts/test/**"
      - ".github/workflows/halmos.yml"

permissions:
  contents: read
jobs:
  halmos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Halmos
        run: pip install halmos==0.3.3
      - name: Build contracts
        run: forge build
        working-directory: contracts
      - name: Run Halmos symbolic checks
        run: halmos --contract RegistrySymbolicTest --function check_ --loop 1
        working-directory: contracts
