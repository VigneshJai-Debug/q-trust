name: Formal Verification (Halmos)

# Symbolically executes contract properties with Halmos.
#
# STATUS: experimental / non-blocking. The full RegistryHandler setUp
# currently trips Halmos' concretize-paths pass ("Multiple paths were found
# in setUp()" — the OZ initializer stack contains internal branching that
# halmos 0.3 cannot flatten). This job therefore runs in report-only mode;
# flip continue-on-error to false once the setup is halmos-clean.

on:
  push:
    branches: [main]
    paths:
      - "contracts/src/**"
      - "contracts/test/**"
      - ".github/workflows/halmos.yml"
  pull_request:
    paths:
      - "contracts/src/**"
      - "contracts/test/**"
      - ".github/workflows/halmos.yml"

permissions:
  contents: read
jobs:
  halmos:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Halmos
        run: pip install halmos
      - name: Build contracts
        run: forge build
        working-directory: contracts
      - name: Run Halmos (report-only)
        run: halmos --match-contract "RegistryInvariant" --loop 1 --invariant-depth 2
        working-directory: contracts
