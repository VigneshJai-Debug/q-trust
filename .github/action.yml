name: 'Q-Trust PQC Scanner'
description: 'Scan codebases for quantum-vulnerable cryptography with risk scoring and compliance checking'
author: 'humoge7502'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  path:
    description: 'Path to scan'
    required: true
    default: '.'
  format:
    description: 'Output format: sarif, json, cbom'
    required: false
    default: 'sarif'
  compliance:
    description: 'Compliance frameworks to check'
    required: false
    default: 'cnsa-2.0'
  ci-mode:
    description: 'CI mode: advisory or blocking'
    required: false
    default: 'advisory'
  threshold:
    description: 'Severity threshold for CI gate'
    required: false
    default: 'high'
  upload-sarif:
    description: 'Upload SARIF to GitHub Security'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Install Q-Trust Inspector
      shell: bash
      run: pip install -e ./inspector

    - name: Run PQC Scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_COMPLIANCE: ${{ inputs.compliance }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_CI_MODE: ${{ inputs.ci-mode }}
      run: |
        # Inputs pass through env (never direct ${{ }} interpolation in run:)
        # to avoid GitHub Actions shell injection.
        crypto-inspector scan-source "$INPUT_PATH" \
          --format "$INPUT_FORMAT" \
          --output "scan-results.$INPUT_FORMAT" \
          --cyclonedx cbom.json \
          --risk \
          --compliance "$INPUT_COMPLIANCE" \
          --ci-gate "$INPUT_THRESHOLD" \
          || { if [ "$INPUT_CI_MODE" = "blocking" ]; then exit 1; fi; }

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: scan-results.sarif
        category: pqc-scan
