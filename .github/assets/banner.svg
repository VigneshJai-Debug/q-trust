<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Q-Trust banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="160" fill="#14b8a6" opacity="0.08"/>
  <circle cx="1120" cy="240" r="110" fill="#0d9488" opacity="0.12"/>

  <!-- Quantum ring mark -->
  <g transform="translate(150,150)">
    <circle r="78" fill="none" stroke="#14b8a6" stroke-width="6" opacity="0.9"/>
    <ellipse rx="78" ry="30" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.65" transform="rotate(-24)"/>
    <ellipse rx="78" ry="30" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.65" transform="rotate(56)"/>
    <circle r="16" fill="url(#accent)"/>
    <text x="0" y="6" text-anchor="middle" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#042f2e">Q</text>
  </g>

  <!-- Wordmark -->
  <text x="280" y="128" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#f0fdfa">Q-Trust</text>
  <text x="282" y="172" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">Enterprise Post-Quantum Migration Protocol</text>

  <!-- Layer chips -->
  <g font-family="Menlo, monospace" font-size="17" fill="#ccfbf1">
    <rect x="282" y="204" width="150" height="40" rx="8" fill="#134e4a"/>
    <text x="357" y="230" text-anchor="middle">CBOM Scanner</text>
    <rect x="444" y="204" width="86" height="40" rx="8" fill="#115e59"/>
    <text x="487" y="230" text-anchor="middle">SDK</text>
    <rect x="542" y="204" width="196" height="40" rx="8" fill="#134e4a"/>
    <text x="640" y="230" text-anchor="middle">GPU Planning Models</text>
    <rect x="750" y="204" width="170" height="40" rx="8" fill="#115e59"/>
    <text x="835" y="230" text-anchor="middle">Base L2 Registry</text>
  </g>

  <rect x="0" y="292" width="1200" height="8" fill="url(#accent)"/>
</svg>
