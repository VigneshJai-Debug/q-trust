# Dependabot dependency updates.
#
# Grouped minor/patch updates per ecosystem to reduce PR noise;
# major bumps still arrive as individual PRs. Weekly cadence.

version: 2

updates:
  # ── Backend (npm) ─────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /backend
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - humoge7502
    open-pull-requests-limit: 10

  # ── Frontend (npm) ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - humoge7502
    open-pull-requests-limit: 10

  # ── Inspector (pip) ───────────────────────────────────────────
  - package-ecosystem: pip
    directory: /inspector
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - humoge7502
    open-pull-requests-limit: 10

  # ── SDK (pip) ─────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /sdk
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - humoge7502
    open-pull-requests-limit: 10

  # ── Dockerfile base images ────────────────────────────────────
  - package-ecosystem: docker
    directory: /backend
    cooldown:
      default-days: 7
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /planner
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - humoge7502
    open-pull-requests-limit: 10

  # ── GitHub Actions versions ───────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - humoge7502
    open-pull-requests-limit: 10
